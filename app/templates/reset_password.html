{% extends "base.html" %}

{% block title %}Set New Password — LyricStudio{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" class="brand-mark">
                    <rect width="32" height="32" rx="6" fill="#1D1D1D"/>
                    <path d="M8 19V13M12 23V9M16 26V6M20 21V11M24 18V14" stroke="#7C5CFC" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <h1>LyricStudio</h1>
            </div>
            <p class="auth-subtitle">Choose a new secure password</p>
        </div>

        {% if error %}
        <div class="auth-error" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="auth-error" role="alert" id="client-error-banner" style="display: none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="client-error-text"></span>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}" id="reset-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="hidden" name="token" id="token-input" value="{{ token or '' }}"/>

            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <div class="password-input-wrapper">
                    <input 
                        class="form-control" 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="At least 6 characters" 
                        required 
                        autocomplete="new-password"
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        id="toggle-password" 
                        title="Show password" 
                        aria-label="Show password"
                        tabindex="0"
                    >
                        <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <div class="password-input-wrapper">
                    <input 
                        class="form-control" 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        placeholder="Re-enter your new password" 
                        required 
                        autocomplete="new-password"
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        id="toggle-confirm-password" 
                        title="Show password" 
                        aria-label="Show password"
                        tabindex="0"
                    >
                        <i class="fa-regular fa-eye" id="toggle-confirm-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn">
                <i class="fa-solid fa-key"></i> Update Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 16px; color: var(--color-text-secondary);">
            <a href="{{ url_for('auth.login') }}" style="color: var(--color-accent); font-weight: 500; text-decoration: none;">Back to sign in</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // If token is in hash (e.g. #access_token=...&type=recovery), populate hidden token field
    if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        if (accessToken) {
            document.getElementById('token-input').value = accessToken;
        }
    }

    function setupToggle(btnId, inputId, iconId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (btn && input && icon) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const isPassword = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPassword ? 'text' : 'password');
                if (isPassword) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
                input.focus();
            });
        }
    }

    setupToggle('toggle-password', 'password', 'toggle-password-icon');
    setupToggle('toggle-confirm-password', 'confirm_password', 'toggle-confirm-icon');

    const form = document.getElementById('reset-form');
    const p1 = document.getElementById('password');
    const p2 = document.getElementById('confirm_password');
    const banner = document.getElementById('client-error-banner');
    const bannerText = document.getElementById('client-error-text');

    if (form) {
        form.addEventListener('submit', function(e) {
            banner.style.display = 'none';
            if (!p1.value || p1.value.length < 6) {
                e.preventDefault();
                bannerText.textContent = 'Password must be at least 6 characters.';
                banner.style.display = 'flex';
                p1.focus();
                return;
            }
            if (p1.value !== p2.value) {
                e.preventDefault();
                bannerText.textContent = 'Passwords do not match.';
                banner.style.display = 'flex';
                p2.focus();
                return;
            }
        });
    }
});
</script>
{% endblock %}
