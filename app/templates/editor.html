<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ project.title }} — LyricStudio Creative Workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230C1A2B'/><path d='M8 19V13M12 23V9M16 26V6M20 21V11M24 18V14' stroke='%23B6FF3B' stroke-width='2.4' stroke-linecap='round'/></svg>">
    
    <!-- Google Fonts for Studio Typography Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- React SPA Styles -->
    <link rel="stylesheet" crossorigin href="{{ url_for('static', filename='editor-dist/assets/index.css') }}">
    
    <script>
        window.__INITIAL_PROJECT_ID__ = "{{ project.id }}";
        window.__INITIAL_USER_ID__ = {{ session.get('user_id', 0) }};
        window.__CSRF_TOKEN__ = "{{ csrf_token() }}";
    </script>
</head>
<body style="margin: 0; padding: 0; background-color: #050b14; color: #f1f5f9; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden;">
    <div id="root">
        <canvas id="preview-canvas" style="display:none;"></canvas>
    </div>
    <!-- React SPA Bundle -->
    <script type="module" crossorigin src="{{ url_for('static', filename='editor-dist/assets/index.js') }}"></script>
</body>
</html>
